[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requestflow"
version = "0.1.0"
description = "stop getting 429 ratelimited like an amateur. high-performance http scheduling and pacing for discord.py."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "requestflow" }
]
keywords = [
    "discord",
    "discord.py",
    "http",
    "ratelimit",
    "queue",
    "scheduler",
    "asyncio",
    "performance"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "discord.py>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.0.0",
    "setuptools>=61.0.0",
    "wheel"
]

[project.urls]
Repository = "https://github.com/snipe1337/requestflow"
Issues = "https://github.com/snipe1337/requestflow/issues"
Community = "https://discord.gg/cse"
Support = "https://discord.gg/cse"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
requestflow = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
